name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 69e84452e69fcd90dfa533795190f95f
        run: |
          npx -y wrangler@4 pages project create nassau-enrollment --production-branch=main || true
          npx -y wrangler@4 pages deploy public --project-name=nassau-enrollment --branch=main --commit-dirty=true
